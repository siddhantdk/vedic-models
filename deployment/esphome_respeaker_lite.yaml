substitutions:
  name: hey-vedic
  friendly_name: "Hey Vedic"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

esp32:
  board: xiao_esp32s3
  variant: esp32s3
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_ESP32S3_DEFAULT_CPU_FREQ_MHZ: "240"
      CONFIG_ESP32S3_DATA_CACHE_64KB: "y"
      CONFIG_ESP32S3_DATA_CACHE_LINE_64B: "y"
    platform_version: 6.9.0

# Wi-Fi - fill in your credentials
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

# Enable web server and API
web_server:
  port: 80

api:
  encryption:
    key: !secret api_encryption_key

ota:
  platform: esphome

logger:
  level: DEBUG

# I2S Microphone for ReSpeaker Lite
i2s_audio:
  - id: i2s_in
    i2s_lrclk_pin: GPIO3
    i2s_bclk_pin: GPIO4
    i2s_mclk_pin: GPIO5

microphone:
  - platform: i2s_audio
    id: mic
    adc_type: external
    i2s_audio_id: i2s_in
    i2s_din_pin: GPIO2
    channel: left
    pdm: false
    bits_per_sample: 32

# Voice Assistant pipeline
voice_assistant:
  id: va
  microphone: mic
  use_wake_word: true
  noise_suppression_level: 0
  volume_multiplier: 2.0
  on_wake_word_detected:
    - voice_assistant.start:
        wake_word: !lambda "return wake_word;"
  on_stt_end:
    - voice_assistant.start:
        wake_word: !lambda "return wake_word;"

# microWakeWord with custom Hey Vedic model
micro_wake_word:
  models:
    - model: "https://raw.githubusercontent.com/YOUR_USERNAME/YOUR_REPO/main/deployment/hey_vedic.json"
  on_wake_word_detected:
    - voice_assistant.start:
        wake_word: !lambda "return wake_word;"

# LED status
light:
  - platform: status_led
    id: status_led
    pin:
      number: GPIO15
      inverted: true
